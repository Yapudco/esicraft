name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Compile and package
        shell: bash
        run: |
          set +e
          mvn -B -ntp clean package 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Remonte les erreurs de compilation en annotations lisibles (visibles sans télécharger les logs).
          grep -E '^\[ERROR\]' build.log | sed 's/^\[ERROR\] //' | head -30 | while read -r line; do echo "::error::${line}"; done
          exit $status

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: esicraft-plugin
          path: target/esicraft-plugin-*.jar
          if-no-files-found: error
