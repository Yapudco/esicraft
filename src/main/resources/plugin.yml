name: Esicraft-Plugin
version: '1.0.0-SNAPSHOT'
main: fr.esicraft.EsicraftPlugin
api-version: '26.2'
authors: [ Antigravity ]
description: Plugin de survie hardcore stratégique avec Guildes, Races, Nexus et Âges de Guilde.

commands:
  esicraft:
    description: Commande principale Esicraft
    aliases: [esi]
    usage: /esicraft [help|reload|info]
  race:
    description: Choisir ou consulter sa race / métier
    aliases: [metier, classe]
    usage: /race [menu|info|set <joueur> <race>]
  guild:
    description: Gestion des guildes et territoires
    aliases: [g, guilde, faction]
    usage: /guild [create|invite|join|leave|kick|spec|claim|unclaim|nexus|info|bank|chat]
  age:
    description: Menu et progression des Âges de guilde
    aliases: [ages, era]
    usage: /age [menu|deposit|info]
  nexus:
    description: Gestion et statut du Nexus de guilde
    usage: /nexus [info|upgrade|repair]
  ah:
    description: Hôtel des ventes et contrats de hordes
    aliases: [hdv, market, marche]
    usage: /ah [sell <prix>|menu]
  money:
    description: Voir son solde (sous-commandes réservées aux administrateurs)
    aliases: [solde]
    usage: /money <get|set|give|take|rectify|top> <joueur|valeur> [montant]
  baltop:
    description: Voir le classement des joueurs les plus riches du serveur
    aliases: [balancetop, topmoney, richest]
    usage: /baltop
  pay:
    description: Transférer des pièces à un autre joueur
    aliases: [payer, virement, sendmoney]
    usage: /pay <joueur> <montant>
  game:
    description: Administration globale du jeu
    permission: esicraft.admin
    usage: /game reset
  guide:
    description: Obtenir le livre officiel de règles et explications
    aliases: [livre, rules, regles]
    usage: /guide
  pvp:
    description: Activer ou désactiver la destruction des Nexus
    permission: esicraft.admin
    aliases: [nexusdestruction, togglenexus]
    usage: /pvp [on|off|toggle]
  esicraftadmin:
    description: Commandes d'administration Esicraft
    permission: esicraft.admin
    usage: /esicraftadmin [setage|spawnraid|forcenexus|resetclaims|giveitems]
  hub:
    description: Se reconnecter au serveur Hub (/server hub)
    aliases: [lobby, mainhub]
    usage: /hub

  contrat:
    description: Voir vos contrats quotidiens
    aliases: [contrats, quetes, daily]
    usage: /contrat
  classement:
    description: Classement de saison des guildes
    aliases: [saison, topguildes]
    usage: /classement
  histoire:
    description: Mémorial des conquêtes et événements du serveur
    aliases: [memorial]
    usage: /histoire
  hud:
    description: Afficher ou masquer le tableau de bord latéral
    usage: /hud
  english:
    description: Switch the game to English (menus, messages, rule book) / passer le jeu en anglais
    aliases: [en, anglais]
    usage: /english [on|off]
  francais:
    description: Repasser le jeu en français / switch the game back to French
    aliases: [fr, french]
    usage: /francais
  journal:
    description: Journal de guerre (derniers grands faits du serveur)
    aliases: [chronique, gazette]
    usage: /journal
  succes:
    description: Voir ses succès (ou ceux d'un joueur)
    aliases: [achievements, hautsfaits]
    usage: /succes [joueur]
  climat:
    description: Saison naturelle en cours et ses effets
    aliases: [nature, meteo]
    usage: /climat
  aide:
    description: Appeler ses alliés à l'aide pendant une attaque
    aliases: [sos, renfort]
    usage: /aide
  deguisement:
    description: Se déguiser en membre d'une autre guilde
    aliases: [masque, disguise]
    usage: /deguisement <guilde|off>
  evenement:
    description: Administration des événements serveur
    permission: esicraft.admin
    aliases: [event]
    usage: /evenement <lune|meteores|marchand|boss|stop|status>

  station:
    description: Voyager entre les gares du réseau ferroviaire
    aliases: [gares, train, metro]
    usage: /station
  rail:
    description: Gérer le réseau ferroviaire de votre guilde (péage, relations)
    aliases: [reseau, gare]
    usage: /rail
  traite:
    description: Traités entre guildes (alliance, pacte de non-agression, vassalité)
    aliases: [traites, treaty]
    usage: /traite [liste]

  merci:
    description: Remercier un joueur (+1 point d'honneur, une fois par jour et par personne)
    aliases: [thanks, honneur]
    usage: /merci [joueur]
  parrain:
    description: Parrainer une recrue ou répondre à une proposition de parrainage
    aliases: [mentor, parrainage]
    usage: /parrain <joueur|accepter|refuser>
  rancon:
    description: Gérer un prisonnier capturé en combat (rançon, libération, exécution)
    aliases: [ransom]
    usage: /rancon [payer|prix <montant>|liberer|executer]
  banque:
    description: Banque de guilde (prêts entre guildes, dettes, coffre commun)
    aliases: [bank, pret]
    usage: /banque [pret|accepter|refuser|dettes|rembourser|pardonner|coffre]

  vote:
    description: "Tribunal des guildes - voter la règle de la semaine (le lundi)"
    aliases: [tribunal]
    usage: /vote [numéro]
  duel:
    description: "Duel d'honneur dans une arène neutre (mise optionnelle)"
    usage: /duel <joueur> [mise] | /duel accepter | /duel refuser
  pari:
    description: "Parier sur un raid ou un duel"
    aliases: [bet]
    usage: /pari <camp> <montant>
  bourse:
    description: "Actions de guilde - acheter, vendre, ouvrir son capital"
    aliases: [actions]
    usage: /bourse [liste|ouvrir|fermer|acheter|vendre|portefeuille]
  taverne:
    description: "Zone neutre - déclarer une taverne, jouer au pile ou face"
    aliases: [tavern]
    usage: /taverne [declarer|retirer|jeu]
  siege:
    description: "Guerre formelle - déclarer un siège avec 24 h de préavis"
    usage: /siege [declarer <guilde> <jour> <heure>|liste|annuler]

  cosmetique:
    description: "Menu des cosmétiques (auras, traînées, effets de victoire) : à gagner ou à acheter"
    aliases: [cosmetic, cosmetics]
    usage: /cosmetique [off]

permissions:
  esicraft.user:
    description: Permission de base pour utiliser les fonctionnalités de jeu
    default: true
  esicraft.admin:
    description: Permission d'administration Esicraft
    default: op
