# ==============================================================================
#                  ESICRAFT-PLUGIN - CONFIGURATION GLOBALE
#            Survie Hardcore & Stratégique Optimisée (+50 joueurs)
# ==============================================================================

# Système de Sauvegarde et Performance
storage:
  type: "SQLITE" # Types supportés : SQLITE, JSON
  save-interval-seconds: 180
  async-chunk-checking: true

# Paramètres du Marché Central et Hôtel des Ventes
market:
  location:
    world: "world"
    x: 0.0
    y: 100.0
    z: 0.0
  tax-percentage: 5.0 # Taxe prélevée sur chaque vente
  max-listings-per-player: 10 # Annonces actives max par joueur (anti-saturation de l'HDV)
  mercenary-hordes-enabled: true

# Progression des Âges (Ressources requises pour débloquer l'Âge supérieur)
ages:
  initial-age: 1
  age-1:
    name: "Âge Rustique"
    description: "Outils en pierre et bois uniquement. Débuts de la civilisation."
    requirements: {} # Âge de départ
  age-2:
    name: "Âge de la Métallurgie"
    description: "Déblocage universel des outils en fer et des boucliers."
    requirements:
      COPPER_INGOT: 750
      LEATHER: 256
      RAW_IRON: 750
      OAK_LOG: 1000
      WHEAT: 1500
      CARROT: 750
  age-3:
    name: "Âge de l'Alchimie"
    description: "Déblocage universel des armures complètes en fer, outils diamant et potions T1."
    requirements:
      IRON_INGOT: 3500
      GOLD_INGOT: 1500
      LAPIS_LAZULI: 1500
      QUARTZ: 1000
      NETHER_WART: 750
      BLAZE_ROD: 150
      MAGMA_CREAM: 150
      GHAST_TEAR: 15
      GLOWSTONE_DUST: 750
      FEATHER: 3500
      POTATO: 6000
      SUGAR_CANE: 6000
      PUMPKIN: 1000
      MELON_SLICE: 2500
      BEETROOT: 1500
  age-4:
