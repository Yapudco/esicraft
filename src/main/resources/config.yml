# Paramètres des Guildes et Claims
guilds:
  creation-cost: 500.0 # Monnaie
  max-members-default: 10
  max-claims-default: 16
  claim-cost-base: 100.0       # Coût du premier chunk (100 pièces)
  claim-cost-increment: 25.0   # Augmentation douce par chunk supplémentaire (+25 pièces / chunk)
  claim-cost-quadratic: 0.0    # Facteur quadratique (0 = augmentation linéaire douce)
  nexus:
    heal-cooldown-seconds: 30 # Délai entre deux soins du Nexus par pomme dorée
    base-health: 5000
    regeneration-rate-per-minute: 50
    invulnerable-during-peace: true
    hologram-display: true

# Contrats de Hordes de Monstres (Achat à l'Hôtel des Ventes)
raids:
  cooldown-minutes-between-raids: 30
  max-custom-horde-units: 60 # Plafond de monstres d'une horde personnalisée (anti-crash serveur)
  types:
    ARMORED_ZOMBIES:
      name: "🧟 Horde de Zombies Cuirassés"
      price: 2500.0
      mob-count: 24
      target-damage-to-nexus: 25
    INCENDIARY_SKELETONS:
      name: "🏹 Légion Squelette Incendiaire"
      price: 3500.0
      mob-count: 20
      target-damage-to-nexus: 35
    TOXIC_SPIDERS:
      name: "🕷️ Essaim d'Araignées Toxiques"
      price: 3000.0
      mob-count: 30
      target-damage-to-nexus: 20
    PILLAGER_SIEGE:
      name: "👺 Siège de Pillards & Ravageurs"
      price: 7500.0
      mob-count: 15
      target-damage-to-nexus: 80

# Métiers (races)
races:
  change-cooldown-hours: 24 # Délai minimum entre deux changements de métier (hors première sélection et admin)
